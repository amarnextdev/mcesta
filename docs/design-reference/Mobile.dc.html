<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LuxCart homepage on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FAF7F2}
a{color:#1F5C5A}a:hover{color:#174644}
</style>
</helmet>
<div style="width: 390px; background: #FAF7F2; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; color: #1F2A2E;">
<dc-import name="Main" show-bar="{{showBar}}" hint-size="390px,11200px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":11200}}'>
class Component extends DCLogic {
  renderVals() {
    return { showBar: true };
  }
}
</script>
</body>
</html>
