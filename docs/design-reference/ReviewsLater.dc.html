<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LuxCart reviews section</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F5C5A}a:hover{color:#174644}
</style>
</helmet>
<div style="width: 1440px; height: 640px; box-sizing: border-box; background: #FAF7F2; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; color: #1F2A2E;">
<section aria-labelledby="reviews-h" style="max-width: 1280px; margin: 0 auto; padding: 40px 24px;">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 24px;">
<div style="display: flex; align-items: center; gap: 12px;">
<h2 id="reviews-h" style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.15;">What customers say</h2>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: #F7E3D8; color: #A84B26;">Example content</span>
</div>
<a href="#reviews" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; color: #1F2A2E; text-decoration: none;">Read all reviews<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
<div style="display: grid; grid-template-columns: 300px repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start;">

<div style="display: flex; flex-direction: column; gap: 12px; padding-right: 24px; border-right: 1px solid #E4D9C8;">
<span style="font-size: 56px; font-weight: 700; line-height: 1;">4.8</span>
<span aria-hidden="true" style="color: #B07A12; font-size: 20px; letter-spacing: 2px;">★★★★★</span>
<span style="font-size: 14px; color: #5A666A;">Based on [number] reviews</span>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px;">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5A666A;">
<span style="width: 24px;">{{b.label}}</span>
<span style="flex: 1; height: 6px; border-radius: 999px; background: #E4D9C8; overflow: hidden;"><span style="display: block; height: 100%; width: {{b.w}}; background: #B07A12;"></span></span>
<span style="width: 34px; text-align: right;">{{b.w}}</span>
</div>
</sc-for>
</div>
<a href="#write-review" style="margin-top: 8px; display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 10px; border: 1.5px solid #1F2A2E; color: #1F2A2E; font-weight: 600; text-decoration: none;">Write a review</a>
</div>

<sc-for list="{{reviews}}" as="r" hint-placeholder-count="3">
<figure style="margin: 0; background: #FFFFFF; border: 1px solid #EFE6D8; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<span aria-hidden="true" style="color: #B07A12; letter-spacing: 2px;">★★★★★</span>
<span style="font-size: 12px; color: #5A666A;">[date]</span>
</div>
<span style="font-size: 16px; font-weight: 600;">{{r.title}}</span>
<blockquote style="margin: 0; font-size: 14px; line-height: 1.55; color: #1F2A2E;">{{r.text}}</blockquote>
<div role="img" aria-label="Customer photo placeholder" style="width: 72px; height: 72px; border-radius: 10px; background: {{r.bg}};"></div>
<figcaption style="display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid #EFE6D8;">
<span style="font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">[Customer name]<span style="font-size: 12px; font-weight: 600; color: #2F6B3A; display: inline-flex; align-items: center; gap: 3px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>Verified buyer</span></span>
<a href="#product" style="font-size: 13px; color: #5A666A;">Reviewed: {{r.product}}</a>
</figcaption>
</figure>
</sc-for>

</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      bars: [
        { label: '5★', w: '[80%]' },
        { label: '4★', w: '[14%]' },
        { label: '3★', w: '[4%]' },
        { label: '2★', w: '[1%]' },
        { label: '1★', w: '[1%]' }
      ].map(function (b, i) { return { label: b.label, w: ['80%', '14%', '4%', '1%', '1%'][i] }; }),
      reviews: [
        { title: '[Review headline]', text: '[Customer review text goes here. Two to four lines about the product, delivery and how it looks at home.]', product: 'Barrel Decanter Set', bg: '#E3EFEC' },
        { title: '[Review headline]', text: '[Customer review text goes here. Two to four lines about the product, delivery and how it looks at home.]', product: 'Walnut Monitor Riser', bg: '#EFE6D8' },
        { title: '[Review headline]', text: '[Customer review text goes here. Two to four lines about the product, delivery and how it looks at home.]', product: 'Orthopedic Dog Bed', bg: '#F7E3D8' }
      ]
    };
  }
}
</script>
</body>
</html>
